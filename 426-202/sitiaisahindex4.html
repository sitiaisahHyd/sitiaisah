<html>
    <head>
        <title>Info Windows</title>

       <style> 
html,
body {
    height: 100%;
    margin: 0;
    padding: 0;
} 
</style>
        <script>
            // prettier-ignore
            (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
                key: "AIzaSyC5l0aPyGFqiqY5DpqOYf-8YhN_eYHHobU"
            });
        </script>
    </head>
    <body>
        <gmp-map
            center="6.6034444,101.33925"
            zoom="18"
            map-id="DEMO_MAP_ID"></gmp-map>
<Script>
    // This example displays a marker at the center of Australia.
// When the user clicks the marker, an info window opens.

async function init() {
    // Import the needed libraries.
    const [{ InfoWindow }, { AdvancedMarkerElement }] = await Promise.all([
        google.maps.importLibrary('maps'),
        google.maps.importLibrary('marker'),
    ]);

    // Get the map element and the inner map from it.
    const mapElement = document.querySelector('gmp-map');
    const innerMap = mapElement.innerMap;

    // Get the center of the map.
    const center = mapElement.center;

    // Create the info window content.
    const heading = document.createElement('h1');
    heading.textContent = 'บ้านเราเองจ้าเตง';

    const content = document.createElement('div');

    const infoParagraph = document.createElement('p');
    infoParagraph.textContent = `คำว่า "นี่บ้านเราเอง" เป็นประโยคสั้น ๆ ที่เปี่ยมไปด้วยพลังและความหมายอันยิ่งใหญ่ต่อจิตใจ เพราะมันไม่ใช่แค่การประกาศถึงกรรมสิทธิ์ในสิ่งปลูกสร้างหรือผืนดิน แต่คือการป่าวประกาศถึงความสำเร็จที่แลกมาด้วยหยาดเหงื่อ แรงกาย และความอดทนตลอดช่วงเวลาที่ผ่านมาในชีวิต บ้านหลังนี้คือพื้นที่ปลอดภัยอันสูงสุด เป็นหลบภัยจากความวุ่นวายและเรื่องราวเหนื่อยล้าจากโลกภายนอก ที่ซึ่งเราสามารถทิ้งตัวลงนอน ปลดปล่อยความเครียด และเป็นตัวของตัวเองได้อย่างเต็มที่โดยไม่ต้องกังวลสิ่งใด อีกทั้งยังเป็นสถานที่ที่มอบอิสรภาพในการสร้างสรรค์และออกแบบชีวิตในแบบที่ตัวเองต้องการ ทุกมุมห้อง ทุกชิ้นเฟอร์นิเจอร์ล้วนบันทึกเรื่องราว ความทรงจำ และความผูกพันของคนในครอบครัวเอาไว้ ยามที่เอ่ยคำนี้ออกมามันจึงเต็มไปด้วยความภาคภูมิใจอย่างที่สุด เป็นหลักฐานเชิงประจักษ์ของการสร้างรากฐานชีวิตที่มั่นคงเพื่ออนาคต และไม่ว่าในวันข้างหน้าจะต้องออกไปเผชิญกับโลกที่กว้างใหญ่หรือเหน็ดเหนื่อยเพียงใด คำว่าบ้านหลังนี้ก็จะยังคงเป็นจุดหมายปลายทางสุดท้ายที่อบอุ่นที่สุด คอยเปิดประตูต้อนรับเรากลับมาเติมพลังชีวิตได้เสมอในทุก ๆ วัน`;

    content.appendChild(infoParagraph);

    const link = document.createElement('a');
    link.href = 'https://wikicommunity.sac.or.th/community/1198';
    link.textContent = 'ดูรายละเอียด...';
    link.target = '_blank';
    content.appendChild(link);

    // Create the info window.
    const infoWindow = new InfoWindow({
        headerContent: heading,
        content,
        ariaLabel: 'Uluru',
        maxWidth: 500, // Set max width (optional).
    });

    // Create the marker.
    const marker = new AdvancedMarkerElement({
        position: center,
        map: innerMap,
        title: 'Uluru (Ayers Rock)',
        gmpClickable: true,
    });

    // Open the info window when the map loads.
    infoWindow.open({
        anchor: marker,
        map: innerMap,
    });

    // Open the info window when the marker is clicked.
    marker.addEventListener('gmp-click', () => {
        infoWindow.open({
            anchor: marker,
            map: innerMap,
        });
    });
}

void init();
</Script>
    </body>
</html>
